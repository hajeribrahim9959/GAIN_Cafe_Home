<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAIN Coffee Shop — 3D Cup</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;color:#49331f;background:#f6f3ee}.stage{position:relative;width:100%;height:100%;min-height:400px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#fff 0%,#f8f4ed 48%,#e6ded2 100%)}#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#scene:active{cursor:grabbing}.top{position:absolute;top:clamp(20px,4vw,46px);left:0;right:0;text-align:center;pointer-events:none;padding:0 18px}.eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:#a36f3f;font-weight:bold}h1{margin:9px 0 5px;font:500 clamp(30px,5vw,54px) Georgia,serif;letter-spacing:.16em}.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8a765e}.hint{position:absolute;left:20px;bottom:25px;font-size:11px;letter-spacing:.06em;color:#8b7b68;background:#ffffffb8;border:1px solid #c9bba866;padding:10px 13px;border-radius:99px}.controls{position:absolute;right:clamp(14px,3vw,36px);bottom:clamp(16px,4vw,30px);display:flex;gap:8px}button{height:44px;min-width:44px;padding:0 13px;border:1px solid #bda98c66;border-radius:14px;background:#fffdf9e8;color:#624934;box-shadow:0 5px 20px #462d190d;cursor:pointer;font-weight:bold}button:hover{transform:translateY(-2px)}#rotate{min-width:78px}@media(max-width:600px){.hint{bottom:80px;left:50%;transform:translateX(-50%);white-space:nowrap}.controls{left:0;right:0;justify-content:center}}
</style></head><body><main class="stage"><canvas id="scene" aria-label="Interactive 3D GAIN coffee cup"></canvas><header class="top"><div class="eyebrow">A little warmth in every cup</div><h1>GAIN</h1><div class="sub">Coffee Shop · Crafted with care</div></header><div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div><div class="controls"><button id="rotate">360°</button><button id="plus" aria-label="Zoom in">＋</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset view">↻</button></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const canvas=document.querySelector('#scene'),stage=document.querySelector('.stage');let renderer,scene,camera,cup,foam,spice,zoom=1,angle=0,dragging=false,lastX=0,autoSpin=true,spinStart=0,spinUntil=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function wrapTexture(){const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,2048,0);g.addColorStop(0,'#c9a779');g.addColorStop(.15,'#f4e5c8');g.addColorStop(.52,'#f8ebd2');g.addColorStop(.88,'#ead3ad');g.addColorStop(1,'#b99568');x.fillStyle=g;x.fillRect(0,0,2048,1024);
for(const [y,h] of [[80,88],[842,88]]){x.fillStyle='#a9432b';x.fillRect(0,y,2048,h);x.fillStyle='#d5a453';x.fillRect(0,y+4,2048,4);x.fillRect(0,y+h-8,2048,4);for(let i=0;i<48;i++){let px=i*44+22,py=y+h/2;x.save();x.translate(px,py);x.rotate(Math.PI/4);x.fillStyle=i%2?'#e0bc70':'#6e7140';x.fillRect(-7,-7,14,14);x.restore()}}
for(let col=0;col<28;col++){let bx=col*76+15;for(let row=0;row<3;row++){let by=250+row*190+(col%2)*25;x.strokeStyle='#7c7047';x.lineWidth=3;x.beginPath();x.moveTo(bx,by+55);x.bezierCurveTo(bx-24,by+12,bx+28,by-8,bx,by-45);x.stroke();for(const [dx,dy,r] of [[-12,30,-.8],[14,10,.7],[-10,-14,-.7],[13,-30,.8]]){x.save();x.translate(bx+dx,by+dy);x.rotate(r);x.fillStyle='#7b7847';x.beginPath();x.ellipse(0,0,7,15,0,0,Math.PI*2);x.fill();x.restore()}x.fillStyle='#c3923f';for(let p=0;p<6;p++){let a=p*Math.PI/3;x.beginPath();x.ellipse(bx+Math.cos(a)*10,by-48+Math.sin(a)*10,6,3.8,a,0,Math.PI*2);x.fill()}}}
x.save();x.translate(1024,510);x.fillStyle='#f2dfbd';x.strokeStyle='#a9432b';x.lineWidth=10;x.beginPath();for(let i=0;i<=240;i++){let a=i*Math.PI*2/240,r=225+10*Math.cos(a*12),px=Math.cos(a)*r,py=Math.sin(a)*r*.82;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.stroke();x.strokeStyle='#d0a15a';x.lineWidth=4;x.stroke();x.fillStyle='#6a4b2c';x.textAlign='center';x.font='bold 116px Georgia';x.fillText('GAIN',0,26);x.font='30px Arial';x.fillText('C O F F E E   S H O P',0,75);x.fillStyle='#9d7135';x.font='54px Georgia';x.fillText('✣',0,-102);x.fillText('✣',0,143);x.restore();return c}
function coffeeTexture(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d'),g=x.createRadialGradient(230,180,20,256,256,330);g.addColorStop(0,'#f7e5c9');g.addColorStop(.65,'#dfb98d');g.addColorStop(1,'#a66c43');x.fillStyle=g;x.fillRect(0,0,512,512);let seed=1245;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let i=0;i<850;i++){let a=rand()*Math.PI*2,r=Math.sqrt(rand())*220;x.fillStyle=rand()>.45?'#8d4c2b':'#b87542';x.globalAlpha=.25+rand()*.6;x.beginPath();x.ellipse(256+Math.cos(a)*r,256+Math.sin(a)*r,1+rand()*4,1+rand()*2,rand()*3,0,Math.PI*2);x.fill()}x.globalAlpha=1;return c}
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(34,1,.1,100);scene.add(new THREE.HemisphereLight(0xfff7e9,0x9c7858,2));let key=new THREE.DirectionalLight(0xfff4df,3.2);key.position.set(-4,7,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);let fill=new THREE.DirectionalLight(0xffffff,1.4);fill.position.set(4,3,4);scene.add(fill);let rim=new THREE.DirectionalLight(0xffc77b,2.1);rim.position.set(3,5,-5);scene.add(rim);let floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({color:0x4e321b,opacity:.19}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;floor.receiveShadow=true;scene.add(floor);cup=new THREE.Group();scene.add(cup);let tex=new THREE.CanvasTexture(wrapTexture());tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();let body=new THREE.Mesh(new THREE.CylinderGeometry(1.04,.76,2.82,160,1,true),new THREE.MeshStandardMaterial({map:tex,roughness:.78,side:THREE.DoubleSide}));body.position.y=1.49;body.castShadow=true;cup.add(body);let inner=new THREE.Mesh(new THREE.CylinderGeometry(.99,.72,2.72,128,1,true),new THREE.MeshStandardMaterial({color:0xe8d3b2,roughness:.95,side:THREE.BackSide}));inner.position.y=1.49;cup.add(inner);const cream=new THREE.MeshStandardMaterial({color:0xf0dfc4,roughness:.42}),gold=new THREE.MeshStandardMaterial({color:0xc59a60,roughness:.38});function ring(r,t,y,m){let o=new THREE.Mesh(new THREE.TorusGeometry(r,t,18,160),m);o.rotation.x=Math.PI/2;o.position.y=y;o.castShadow=true;cup.add(o)}ring(1.04,.065,2.91,gold);ring(1.035,.045,2.955,cream);let lip=new THREE.Mesh(new THREE.CylinderGeometry(1.035,1.02,.075,160),cream);lip.position.y=2.925;cup.add(lip);let ct=new THREE.CanvasTexture(coffeeTexture());ct.colorSpace=THREE.SRGBColorSpace;let coffee=new THREE.Mesh(new THREE.CircleGeometry(.96,128),new THREE.MeshStandardMaterial({map:ct,roughness:.9}));coffee.rotation.x=-Math.PI/2;coffee.position.y=2.966;cup.add(coffee);foam=new THREE.Mesh(new THREE.CircleGeometry(.91,128),new THREE.MeshStandardMaterial({color:0xf5e7d0,roughness:1}));foam.rotation.x=-Math.PI/2;foam.position.y=2.972;cup.add(foam);let seed=6789;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);let pos=[];for(let i=0;i<1800;i++){let a=rand()*Math.PI*2,r=Math.sqrt(rand())*.84;pos.push(Math.cos(a)*r,2.98+rand()*.004,Math.sin(a)*r)}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));spice=new THREE.Points(geo,new THREE.PointsMaterial({color:0x754022,size:.014,transparent:true,opacity:.82}));cup.add(spice);let base=new THREE.Mesh(new THREE.CylinderGeometry(.77,.73,.12,128),new THREE.MeshStandardMaterial({color:0xc4a17b,roughness:.9}));base.position.y=.08;base.castShadow=true;cup.add(base);ring(.755,.018,.13,gold);cup.rotation.y=Math.PI;
function resize(){let r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.position.set(0,1.9,r.width<600?8.9:7.5);camera.lookAt(0,1.58,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();const clock=new THREE.Clock();function animate(){let elapsed=clock.getElapsedTime();if(autoSpin&&!dragging)angle+=.0032;if(spinUntil){let p=clamp((performance.now()-spinUntil)/3200,0,1);angle=spinStart+Math.PI*2*(1-Math.pow(1-p,3));if(p>=1)spinUntil=0}cup.rotation.y=Math.PI+angle;cup.scale.setScalar(zoom);foam.position.y=2.972+Math.sin(elapsed*1.2)*.002;spice.position.y=Math.sin(elapsed*.8)*.002;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();
}catch(e){document.querySelector('.hint').textContent='Connect to the internet to load the 3D engine.';console.error(e)}
canvas.addEventListener('pointerdown',e=>{dragging=true;autoSpin=false;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging){angle+=(e.clientX-lastX)*.009;lastX=e.clientX}});function stop(){dragging=false}canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY>0?.93:1.07),.68,1.55)},{passive:false});document.querySelector('#rotate').onclick=()=>{autoSpin=false;spinStart=angle;spinUntil=performance.now()+1};document.querySelector('#plus').onclick=()=>zoom=clamp(zoom*1.14,.68,1.55);document.querySelector('#minus').onclick=()=>zoom=clamp(zoom/1.14,.68,1.55);document.querySelector('#reset').onclick=()=>{angle=0;zoom=1;autoSpin=true;spinUntil=0};
</script></body></html>
